spring:
  application:
    name: owlly
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:owlly}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

# 민감 문자열(계좌번호 등) 암호화 키. DB 비밀번호처럼 .env(OWLLY_CRYPTO_AES_KEY)로 주입한다.
# Base64 32바이트(AES-256). TODO(운영): KMS/Vault 로 관리·교체.
owlly:
  crypto:
    aes-key: ${OWLLY_CRYPTO_AES_KEY}
